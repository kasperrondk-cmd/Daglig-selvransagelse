<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daglig selvransagelse</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f1eb;
  margin: 0;
  padding: 20px;
}

.card {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
  text-align: center;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="card">

<h1>Daglig selvransagelse</h1>

<button onclick="testFirebase()">
🔥 TEST FIREBASE
</button>

<div id="status">
Tryk på knappen.
</div>

</div>

<script>

async function testFirebase() {

  const status = document.getElementById("status");

  status.innerText = "⏳ Forsøger at indlæse Firebase...";

  try {

    const firebaseApp = await import(
      "https://www.gstatic.com/firebasejs/11.10.1/firebase-app.js"
    );

    status.innerText =
      "✅ Firebase kunne indlæses!";

  } catch (error) {

    status.innerText =
      "❌ FIREBASE FEJL: " +
      error.name +
      " — " +
      error.message;

  }

}

</script>

</body>
</html>
