<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daglig selvransagelse</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f1eb;
  margin: 0;
  padding: 20px;
}

.card {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
  text-align: center;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="card">

<h1>Daglig selvransagelse</h1>

<button onclick="testNotification()">
🔔 TEST NOTIFIKATION
</button>

<button onclick="registerFirebase()">
🔥 TEST FIREBASE
</button>

<div id="status">
Tryk på en knap.
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.1/firebase-app.js";

import {
  getMessaging,
  register
}
from "https://www.gstatic.com/firebasejs/11.10.1/firebase-messaging.js";


const firebaseConfig = {
  apiKey: "AIzaSyAT3yL3DLsbP2X09LlVVdtRYblBEu2PQ4B",
  authDomain: "daglig-selvransagelse.firebaseapp.com",
  projectId: "daglig-selvransagelse",
  storageBucket: "daglig-selvransagelse.firebasestorage.app",
  messagingSenderId: "719561955217",
  appId: "1:719561955217:web:9cf07b4916be3a47756c30",
  measurementId: "G-VJL61G94LP"
};

const VAPID_KEY =
"BFegX-4u2IMOaLx_6e9WkODDZR_ishwuvzdUYmt3w1_Q-YMndVAD9HvxXszXR-Ny2oAhpnPOtGPdxzTcdGj1mEc";


const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);


window.testNotification = async function() {

  const status = document.getElementById("status");

  try {

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      status.innerText =
        "❌ Notifikationer er ikke tilladt.";
      return;
    }

    new Notification(
      "Daglig selvransagelse",
      {
        body: "🎉 Din testnotifikation virker!"
      }
    );

    status.innerText =
      "✅ Notifikation sendt!";

  } catch (error) {

    status.innerText =
      "❌ FEJL: " + error.message;

  }

};


window.registerFirebase = async function() {

  const status = document.getElementById("status");

  status.innerText =
    "⏳ Registrerer Firebase...";

  try {

    const permission =
      await Notification.requestPermission();

    if (permission !== "granted") {

      status.innerText =
        "❌ Notifikationer er ikke tilladt.";

      return;
    }

    const registration =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js"
      );

    status.innerText =
      "⏳ Service Worker fundet. Registrerer Firebase...";

    await register(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    status.innerText =
      "✅ Firebase-registrering lykkedes!";

  } catch (error) {

    status.innerText =
      "❌ FIREBASE FEJL: " +
      error.name +
      " — " +
      error.message;

  }

};

</script>

</body>
</html>
