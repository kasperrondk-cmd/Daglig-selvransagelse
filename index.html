<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f1eb;
  padding: 30px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  max-width: 500px;
  margin: auto;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  font-size: 17px;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
}
</style>
</head>

<body>

<div class="card">

<h1>Firebase test</h1>

<button onclick="testFirebase()">
🔥 TEST FIREBASE
</button>

<div id="status">
Tryk på knappen.
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/11.10.1/firebase-app-compat.js"></script>

<script>

function testFirebase() {

  const status = document.getElementById("status");

  try {

    if (typeof firebase === "undefined") {

      status.innerText =
        "❌ Firebase blev ikke indlæst.";

      return;
    }

    status.innerText =
      "✅ Firebase blev indlæst!";

  } catch (error) {

    status.innerText =
      "❌ FEJL: " + error.message;

  }

}

</script>

</body>
</html>
