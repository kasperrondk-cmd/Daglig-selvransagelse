<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daglig selvransagelse TEST</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f1eb;
  margin: 0;
  padding: 20px;
}

.card {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 17px;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
  text-align: center;
}
</style>
</head>

<body>

<div class="card">

<h1>Daglig selvransagelse</h1>

<p><strong>TEST 1</strong></p>

<button onclick="testButton()">
🔔 TEST KNAPPEN
</button>

<div id="status">
Tryk på knappen ovenfor.
</div>

</div>

<script>

function testButton() {
  document.getElementById("status").innerText =
    "✅ KNAPPEN VIRKER!";
}

</script>

</body>
</html>
